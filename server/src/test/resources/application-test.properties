# Test Configuration
# This configuration is used when running tests with @ActiveProfiles("test")

# MongoDB Configuration
# Integration tests that need a real deployment read MONGODB_URI and skip themselves when it is absent
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=sample_airbnb

# Server Configuration
# Use a random port for tests to avoid conflicts
server.port=0

# Logging Configuration
# More verbose logging for tests
logging.level.com.kumusha=DEBUG
logging.level.org.mongodb.driver=INFO
logging.level.org.springframework.data.mongodb=DEBUG

# Test-specific settings
spring.main.lazy-initialization=false
