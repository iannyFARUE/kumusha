# MongoDB Configuration
# Connection URI should be provided with the MONGODB_URI environment variable
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=sample_airbnb

# Server Configuration
# Default port is 3001, can be overridden with the PORT environment variable
server.port=${PORT:3001}

# CORS Configuration
# Comma-separated list of allowed origins for cross-origin requests
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000}

# Write Operations
# The create, update, delete and embedding backfill endpoints are unauthenticated, so they are
# disabled unless explicitly turned on. The default is false so that a deployment which forgets to
# configure this is read-only rather than open to anyone who can reach it. Local development sets
# WRITE_ENABLED=true via .env (see .env.example).
kumusha.write.enabled=${WRITE_ENABLED:false}

# Voyage AI Configuration
# API key for the Voyage AI embedding model (required for vector search and the embedding backfill)
voyage.api.key=${VOYAGE_API_KEY:}

# Embedding Configuration
# The sample_airbnb dataset ships without embeddings, so this application generates them itself.
# The field name and dimension count must match the vector search index definition.
kumusha.embedding.field=description_embedding
kumusha.embedding.dimensions=2048
kumusha.embedding.model=voyage-3-large

# Application Info
spring.application.name=kumusha

# Health endpoint
# Only health is exposed. The other actuator endpoints report configuration and runtime internals,
# and nothing here authenticates a caller, so they stay off.
management.endpoints.web.exposure.include=health
# Details stay hidden for the same reason: the payload names the components it probed, including
# the database. Platforms only need the overall UP/DOWN to decide whether to route traffic.
management.endpoint.health.show-details=never
# Report liveness and readiness separately, so a container that is running but cannot reach
# MongoDB is restarted rather than sent requests it will fail
management.endpoint.health.probes.enabled=true

# Logging Configuration
# Log level can be overridden with LOG_LEVEL environment variable
# Available levels: TRACE, DEBUG, INFO, WARN, ERROR
logging.level.com.kumusha=${LOG_LEVEL:INFO}
logging.level.org.mongodb.driver=WARN
# Suppress connection pool maintenance warnings (these are usually harmless)
logging.level.org.mongodb.driver.connection=ERROR

# Console logging pattern with colors and timestamps
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%5p){highlight} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# File logging (optional - enabled when LOG_FILE is set)
logging.file.name=${LOG_FILE:}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %5p --- [%15.15t] %-40.40logger{39} : %m%n
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=5

# Jackson Configuration (JSON serialization)
spring.jackson2.default-property-inclusion=non_null

# API Documentation (Swagger/OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Disable "Try it out" by default (user must click to enable)
springdoc.swagger-ui.tryItOutEnabled=false
# Display request duration in Swagger UI
springdoc.swagger-ui.displayRequestDuration=true
# Enable deep linking for direct access to operations
springdoc.swagger-ui.deepLinking=true
# Show request/response examples
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
